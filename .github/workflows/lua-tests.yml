name: Lua tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install --yes luajit
      - name: Run core tests
        run: luajit tests/test_midi_core.lua
